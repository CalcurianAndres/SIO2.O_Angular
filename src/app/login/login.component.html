          <ellipse cx="75" cy="20" rx="10" ry="15" fill="none" stroke="#5D3A1A" stroke-width="3"/>
          <!-- Main label -->
          <rect x="22" y="45" width="66" height="50" rx="4" fill="url(#bagLabelGrad)"/>
          <rect x="27" y="50" width="56" height="25" rx="2" fill="white" opacity="0.9"/>
          <rect x="30" y="53" width="40" height="4" rx="1" fill="#e91e63"/>
          <rect x="30" y="60" width="50" height="3" rx="1" fill="#adb5bd"/>
          <rect x="30" y="66" width="35" height="3" rx="1" fill="#adb5bd"/>
          <circle cx="75" cy="85" r="8" fill="#ffeb3b"/>
          <rect x="30" y="80" width="35" height="12" rx="2" fill="#26343d"/>
          <!-- Secondary info -->
          <rect x="22" y="100" width="66" height="3" rx="1" fill="#5D3A1A" opacity="0.5"/>
          <rect x="22" y="108" width="50" height="2" rx="1" fill="#adb5bd"/>
          <rect x="22" y="115" width="55" height="2" rx="1" fill="#adb5bd"/>
          <!-- CMYK strip -->
          <rect x="22" y="125" width="66" height="6" rx="1">
            <animate attributeName="fill" values="#00bcd4;#e91e63;#ffeb3b;#26343d;#00bcd4" dur="4s" repeatCount="indefinite"/>
          </rect>
          <!-- Color bars -->
          <rect x="22" y="135" width="10" height="5" fill="#00bcd4"/>
          <rect x="34" y="135" width="10" height="5" fill="#e91e63"/>
          <rect x="46" y="135" width="10" height="5" fill="#ffeb3b"/>
          <rect x="58" y="135" width="10" height="5" fill="#26343d"/>
          <!-- Registration mark -->
          <circle cx="88" cy="138" r="3" fill="none" stroke="#ffeb3b" stroke-width="0.5"/>
          <line x1="88" y1="135" x2="88" y2="141" stroke="#ffeb3b" stroke-width="0.5"/>
          <line x1="85" y1="138" x2="91" y2="138" stroke="#ffeb3b" stroke-width="0.5"/>
        </svg>
      </div>
    </div>

    <div class="rgb-splitter">
      <div class="rgb-bar rgb-r"></div>
      <div class="rgb-bar rgb-g"></div>
      <div class="rgb-bar rgb-b"></div>
    </div>
  </div>

  <div class="login-content">
    <div class="logo-section">
      <img src="../../assets/LOGO-SIO.png" alt="SIO Logo" class="logo" />
    </div>

    <div class="form-section">
      <div class="rainbow-bar"></div>
      <div class="form-header">
        <h1 class="welcome-text">Bienvenido</h1>
        <p class="subtitle">Sistema Integral Operativo</p>
      </div>

      <ng-container *ngIf="session_name">
        <div class="session-info">
          <div class="avatar-glow">
            <div class="avatar">
              <i class="fas fa-user"></i>
            </div>
          </div>
          <div class="session-details">
            <span class="session-name">{{ session_name }}</span>
            <a (click)="borrar_sessiones()" class="change-user">¿No eres {{ session_name }}?</a>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!session_name">
        <div class="input-group">
          <label for="email" class="input-label">Correo electrónico</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              placeholder="correo@ejemplo.com"
              [(ngModel)]="Correo"
              (keyup.enter)="login()"
              class="input-field"
            />
          </div>
        </div>
      </ng-container>

      <div class="input-group">
        <label for="password" class="input-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            [(ngModel)]="Password"
            (keyup.enter)="login()"
            class="input-field"
          />
        </div>
      </div>

      <div class="remember-row" [hidden]="session_name">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="recuerdame" />
          <span class="checkmark"></span>
          <span class="remember-text">Recuerdame</span>
        </label>
      </div>

      <button class="login-button" (click)="login()">
        <span>Iniciar sesión</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <div class="cmyk-footer">
        <div class="cmyk-dot cyan"></div>
        <div class="cmyk-dot magenta"></div>
        <div class="cmyk-dot yellow"></div>
        <div class="cmyk-dot black"></div>
      </div>
    </div>
  </div>
</div>
