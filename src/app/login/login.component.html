<div class="login-container">
  <div class="animated-background">
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
      <div class="shape shape-5"></div>
      <div class="shape shape-6"></div>
    </div>

    <div class="registration-marks">
      <svg class="reg-mark reg-1" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="50" y1="0" x2="50" y2="100" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <circle cx="50" cy="50" r="5" fill="#26343d" opacity="0.15"/>
      </svg>
      <svg class="reg-mark reg-2" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="50" y1="0" x2="50" y2="100" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <circle cx="50" cy="50" r="5" fill="#26343d" opacity="0.15"/>
      </svg>
      <svg class="reg-mark reg-3" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="50" y1="0" x2="50" y2="100" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#26343d" stroke-width="1" opacity="0.25"/>
        <circle cx="50" cy="50" r="5" fill="#26343d" opacity="0.15"/>
      </svg>
    </div>

    <div class="halftone-grid">
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
      <div class="halftone-dot"></div>
    </div>

    <div class="floating-paper paper-1">
      <svg viewBox="0 0 100 120" class="paper-svg">
        <rect x="5" y="5" width="90" height="110" rx="4" fill="white" stroke="#e0e0e0" stroke-width="1"/>
        <line x1="15" y1="25" x2="85" y2="25" stroke="#f0f0f0" stroke-width="8"/>
        <line x1="15" y1="45" x2="70" y2="45" stroke="#f0f0f0" stroke-width="8"/>
        <line x1="15" y1="65" x2="60" y2="65" stroke="#f0f0f0" stroke-width="8"/>
      </svg>
    </div>
    <div class="floating-paper paper-2">
      <svg viewBox="0 0 100 120" class="paper-svg">
        <rect x="5" y="5" width="90" height="110" rx="4" fill="white" stroke="#e0e0e0" stroke-width="1"/>
        <line x1="15" y1="30" x2="75" y2="30" stroke="#f5f5f5" stroke-width="10"/>
        <line x1="15" y1="55" x2="55" y2="55" stroke="#f5f5f5" stroke-width="10"/>
      </svg>
    </div>
  </div>

  <div class="login-content">
    <div class="logo-section">
      <img src="../../assets/LOGO-SIO.png" alt="SIO Logo" class="logo" />
    </div>

    <div class="form-section">
      <div class="form-header">
        <h1 class="welcome-text">Bienvenido</h1>
        <p class="subtitle">Sistema Integral Operativo</p>
      </div>

      <ng-container *ngIf="session_name">
        <div class="session-info">
          <div class="avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="session-details">
            <span class="session-name">{{ session_name }}</span>
            <a (click)="borrar_sessiones()" class="change-user">¿No eres {{ session_name }}?</a>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!session_name">
        <div class="input-group">
          <label for="email" class="input-label">Correo electrónico</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              placeholder="correo@ejemplo.com"
              [(ngModel)]="Correo"
              (keyup.enter)="login()"
              class="input-field"
            />
          </div>
        </div>
      </ng-container>

      <div class="input-group">
        <label for="password" class="input-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            [(ngModel)]="Password"
            (keyup.enter)="login()"
            class="input-field"
          />
        </div>
      </div>

      <div class="remember-row" [hidden]="session_name">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="recuerdame" />
          <span class="checkmark"></span>
          <span class="remember-text">Recuerdame</span>
        </label>
      </div>

      <button class="login-button" (click)="login()">
        <span>Iniciar sesión</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <div class="cmyk-accent">
      <div class="cmyk-dot cyan"></div>
      <div class="cmyk-dot magenta"></div>
      <div class="cmyk-dot yellow"></div>
      <div class="cmyk-dot black"></div>
    </div>
  </div>
</div>
