<div class="login-page">

  <!-- ═══════════ PANEL IZQUIERDO — Diseño Offset ═══════════ -->
  <div class="design-panel">

    <!-- Gradiente base animado -->
    <div class="gradient-bg"></div>

    <!-- Barras offset diagonales animadas -->
    <div class="offset-bars">
      <div class="bar bar-1"></div>
      <div class="bar bar-2"></div>
      <div class="bar bar-3"></div>
      <div class="bar bar-4"></div>
      <div class="bar bar-5"></div>
      <div class="bar bar-6"></div>
      <div class="bar bar-7"></div>
    </div>

    <!-- Círculos halftone animados -->
    <div class="halftone-circles">
      <div class="hc hc-1"></div>
      <div class="hc hc-2"></div>
      <div class="hc hc-3"></div>
      <div class="hc hc-4"></div>
      <div class="hc hc-5"></div>
      <div class="hc hc-6"></div>
      <div class="hc hc-7"></div>
      <div class="hc hc-8"></div>
      <div class="hc hc-9"></div>
      <div class="hc hc-10"></div>
      <div class="hc hc-11"></div>
      <div class="hc hc-12"></div>
    </div>

    <!-- Separación CMYK -->
    <div class="cmyk-separation">
      <svg class="cmyk-svg" viewBox="0 0 400 600">
        <!-- Canales de separación superpuestos con overprint -->
        <circle cx="180" cy="250" r="100" fill="#00bcd4" opacity="0.3" class="ch-c"/>
        <circle cx="220" cy="280" r="100" fill="#e91e63" opacity="0.3" class="ch-m"/>
        <circle cx="200" cy="300" r="100" fill="#ffeb3b" opacity="0.3" class="ch-y"/>
        <circle cx="200" cy="270" r="80"  fill="#1a1a2e" opacity="0.25" class="ch-k"/>

        <!-- Registration marks -->
        <g class="reg-marks" opacity="0.4">
          <circle cx="30" cy="30" r="12" fill="none" stroke="white" stroke-width="0.8"/>
          <line x1="30" y1="18" x2="30" y2="42" stroke="white" stroke-width="0.8"/>
          <line x1="18" y1="30" x2="42" y2="30" stroke="white" stroke-width="0.8"/>
          <circle cx="370" cy="30" r="12" fill="none" stroke="white" stroke-width="0.8"/>
          <line x1="370" y1="18" x2="370" y2="42" stroke="white" stroke-width="0.8"/>
          <line x1="358" y1="30" x2="382" y2="30" stroke="white" stroke-width="0.8"/>
          <circle cx="30" cy="570" r="12" fill="none" stroke="white" stroke-width="0.8"/>
          <line x1="30" y1="558" x2="30" y2="582" stroke="white" stroke-width="0.8"/>
          <line x1="18" y1="570" x2="42" y2="570" stroke="white" stroke-width="0.8"/>
          <circle cx="370" cy="570" r="12" fill="none" stroke="white" stroke-width="0.8"/>
          <line x1="370" y1="558" x2="370" y2="582" stroke="white" stroke-width="0.8"/>
          <line x1="358" y1="570" x2="382" y2="570" stroke="white" stroke-width="0.8"/>
        </g>

        <!-- Color bars (CMYK strip) -->
        <g class="color-bars">
          <rect x="30"  y="540" width="25" height="10" fill="#00bcd4" opacity="0.6"/>
          <rect x="55"  y="540" width="25" height="10" fill="#e91e63" opacity="0.6"/>
          <rect x="80"  y="540" width="25" height="10" fill="#ffeb3b" opacity="0.6"/>
          <rect x="105" y="540" width="25" height="10" fill="#1a1a2e" opacity="0.6"/>
          <rect x="130" y="540" width="25" height="10" fill="#ff9800" opacity="0.6"/>
          <rect x="155" y="540" width="25" height="10" fill="#9c27b0" opacity="0.6"/>
          <rect x="180" y="540" width="25" height="10" fill="#4caf50" opacity="0.6"/>
          <rect x="205" y="540" width="25" height="10" fill="#f03a5f" opacity="0.6"/>
        </g>

        <!-- Trapping lines -->
        <g class="trapping" opacity="0.3">
          <rect x="100" y="400" width="200" height="1" fill="white"/>
          <rect x="100" y="420" width="200" height="0.5" fill="white"/>
          <rect x="100" y="440" width="200" height="2" fill="white"/>
          <rect x="100" y="460" width="200" height="0.5" fill="white"/>
          <rect x="100" y="480" width="200" height="1" fill="white"/>
        </g>
      </svg>
    </div>

    <!-- Texto de bienvenida -->
    <div class="welcome-content">
      <h1 class="welcome-title">SIO</h1>
      <p class="welcome-subtitle">Sistema Integral Operativo</p>
      <div class="welcome-divider"></div>
      <p class="welcome-tagline">Poligrafica Industrial C.A.</p>
    </div>

    <!-- Logo flotante -->
    <div class="floating-logo">
      <img src="../../assets/LOGO-SIO.png" alt="SIO" class="logo-img" />
    </div>

    <!-- CMYK dots decorativos -->
    <div class="cmyk-dots">
      <div class="dot-row">
        <span class="cd cyan"></span>
        <span class="cd magenta"></span>
        <span class="cd yellow"></span>
        <span class="cd black"></span>
      </div>
      <div class="dot-row">
        <span class="cd magenta"></span>
        <span class="cd yellow"></span>
        <span class="cd black"></span>
        <span class="cd cyan"></span>
      </div>
    </div>
  </div>

  <!-- ═══════════ PANEL DERECHO — Formulario ═══════════ -->
  <div class="form-panel">
    <div class="form-wrapper">

      <div class="form-header">
        <div class="form-logo">
          <img src="../../assets/LOGO-SIO.png" alt="SIO" class="form-logo-img" />
        </div>
        <h2 class="form-title">LOGIN</h2>
      </div>

      <ng-container *ngIf="session_name">
        <div class="session-card field is-grouped">
          <div class="session-avatar control">
            <i class="fas fa-user"></i>
          </div>
          <div class="session-info control">
            <span class="session-name">{{ session_name }} </span>
            <a (click)="borrar_sessiones()" class="session-link"> ¿No eres {{ session_name }}?</a>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!session_name">
        <div class="form-group">
          <div class="input-icon">
            <i class="fas fa-user"></i>
          </div>
          <input
            type="email"
            placeholder="Email"
            [(ngModel)]="Correo"
            (keyup.enter)="login()"
            class="form-input"
          />
        </div>
      </ng-container>

      <div class="form-group">
        <div class="input-icon">
          <i class="fas fa-lock"></i>
        </div>
        <input
          type="password"
          placeholder="Password"
          [(ngModel)]="Password"
          (keyup.enter)="login()"
          class="form-input"
        />
      </div>

      <div class="form-options">
        <label class="check-wrapper" [hidden]="session_name">
          <input type="checkbox" id="recuerdame" />
          <span class="check-circle"></span>
          <span>Recuerdame</span>
        </label>
        <a class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="login-btn" (click)="login()">
        INGRESAR
      </button>
    </div>
  </div>
</div>
