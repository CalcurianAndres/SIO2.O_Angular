<app-page-layout>
  <app-section-header
    title="Almacenes"
    description="Gestión de ubicaciones de almacenamiento"
    icon="fa-warehouse"
    color="orange"
  ></app-section-header>
  <br />

  <div class="card">
    <div class="card-content">
      <div class="columns is-variable is-2 is-vcentered">
        <div class="column is-4">
          <input class="input" type="text" placeholder="Nombre del almacén" [(ngModel)]="nuevoNombre" (keyup.enter)="agregar()" />
        </div>
        <div class="column is-4">
          <input class="input" type="text" placeholder="Descripción (opcional)" [(ngModel)]="nuevaDescripcion" (keyup.enter)="agregar()" />
        </div>
        <div class="column is-narrow">
          <button class="button is-info" (click)="agregar()" [disabled]="!nuevoNombre.trim()">
            <span class="icon"><i class="fas fa-plus"></i></span>
            <span>Agregar</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <br />

  <!-- Almacén principal -->
  <div class="card almacen-principal-card">
    <div class="card-content" style="padding: 0.75rem 1rem">
      <div class="columns is-vcentered is-variable is-2">
        <div class="column is-4">
          <span class="has-text-weight-bold">Almacén principal</span>
          <span class="tag is-success is-light ml-2">Predeterminado</span>
        </div>
        <div class="column is-4">
          <span class="has-text-grey is-size-7">Almacén interno de Poligráfica</span>
        </div>
        <div class="column is-narrow" style="margin-left: auto">
          <button class="button is-small is-ghost" (click)="toggleSecciones(almacenPrincipalId)" title="Secciones">
            <span class="icon"><i class="fas fa-layer-group" [ngClass]="{ 'has-text-info': expandedSecciones[almacenPrincipalId] }"></i></span>
          </button>
        </div>
      </div>
      <div *ngIf="expandedSecciones[almacenPrincipalId]" class="mt-3" style="border-top: 1px solid var(--border-color, #ddd); padding-top: 0.75rem">
        <div class="field has-addons mb-2">
          <div class="control is-expanded">
            <input class="input is-small" type="text" placeholder="Nueva sección" [(ngModel)]="nuevaSeccionNombre" (keyup.enter)="agregarSeccion(almacenPrincipalId)" />
          </div>
          <div class="control">
            <button class="button is-small is-info" (click)="agregarSeccion(almacenPrincipalId)" [disabled]="!nuevaSeccionNombre.trim()">
              <span class="icon"><i class="fas fa-plus"></i></span>
            </button>
          </div>
        </div>
        <div *ngFor="let seccion of seccionesOf(almacenPrincipalId)" class="columns is-vcentered is-variable is-2" style="padding: 0.25rem 0">
          <div class="column is-6">
            <ng-container *ngIf="editandoSeccionId !== seccion._id; else editSecNombrePrincipal">
              <span class="is-size-7">{{ seccion.nombre }}</span>
              <span *ngIf="seccion.por_defecto" class="tag is-success is-light ml-1" style="font-size: 0.6rem">D</span>
            </ng-container>
            <ng-template #editSecNombrePrincipal>
              <input class="input is-small" type="text" [(ngModel)]="editandoSeccionNombre" (keyup.enter)="guardarEdicionSeccion(seccion)" />
            </ng-template>
          </div>
          <div class="column is-narrow" style="margin-left: auto">
            <ng-container *ngIf="editandoSeccionId !== seccion._id; else editSecActionsPrincipal">
              <button class="button is-small is-ghost" (click)="iniciarEdicionSeccion(seccion)" title="Editar">
                <span class="icon"><i class="fas fa-pen" style="color: var(--accent-blue); font-size: 0.7rem"></i></span>
              </button>
              <button class="button is-small is-ghost" (click)="eliminarSeccion(seccion)" title="Eliminar" [disabled]="seccion.por_defecto">
                <span class="icon"><i class="fas fa-trash" style="color: var(--status-danger); font-size: 0.7rem"></i></span>
              </button>
            </ng-container>
            <ng-template #editSecActionsPrincipal>
              <button class="button is-small is-success" (click)="guardarEdicionSeccion(seccion)">
                <span class="icon"><i class="fas fa-check" style="font-size: 0.7rem"></i></span>
              </button>
              <button class="button is-small" (click)="cancelarEdicionSeccion()">
                <span class="icon"><i class="fas fa-times" style="font-size: 0.7rem"></i></span>
              </button>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>

  <br />

  <ng-container *ngIf="cargando && almacenesList.length === 0">
    <div class="skeleton-list">
      <div *ngFor="let _ of [].constructor(3)" class="card skeleton-order-card">
        <div class="card-header"><div class="skeleton-line" style="width: 40%"></div></div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="!cargando && almacenesList.length === 0">
    <div class="empty-state">
      <i class="fas fa-warehouse empty-icon"></i>
      <p class="empty-title">No hay almacenes externos registrados</p>
      <p class="empty-hint">Crea el primer almacén externo usando el formulario superior</p>
    </div>
  </ng-container>

  <div class="card" *ngFor="let almacen of almacenesList">
    <div class="card-content" style="padding: 0.75rem 1rem">
      <div class="columns is-vcentered is-variable is-2">
        <div class="column is-4">
          <ng-container *ngIf="editandoId !== almacen._id; else editNombre">
            <span class="has-text-weight-bold">{{ almacen.nombre }}</span>
            <span *ngIf="almacen.por_defecto" class="tag is-success is-light ml-2">Predeterminado</span>
          </ng-container>
          <ng-template #editNombre>
            <input class="input is-small" type="text" [(ngModel)]="editandoNombre" (keyup.enter)="guardarEdicion(almacen)" />
          </ng-template>
        </div>
        <div class="column is-4">
          <ng-container *ngIf="editandoId !== almacen._id; else editDesc">
            <span class="has-text-grey is-size-7">{{ almacen.descripcion || '—' }}</span>
          </ng-container>
          <ng-template #editDesc>
            <input class="input is-small" type="text" [(ngModel)]="editandoDescripcion" (keyup.enter)="guardarEdicion(almacen)" />
          </ng-template>
        </div>
        <div class="column is-narrow" style="margin-left: auto">
          <ng-container *ngIf="editandoId !== almacen._id; else editActions">
            <button class="button is-small is-ghost" (click)="toggleSecciones(almacen._id)" title="Secciones">
              <span class="icon"><i class="fas fa-layer-group" [ngClass]="{ 'has-text-info': expandedSecciones[almacen._id] }"></i></span>
            </button>
            <button class="button is-small is-ghost" (click)="iniciarEdicion(almacen)" title="Editar">
              <span class="icon"><i class="fas fa-pen" style="color: var(--accent-blue)"></i></span>
            </button>
            <button class="button is-small is-ghost" (click)="eliminar(almacen)" title="Eliminar" [disabled]="almacen.por_defecto">
              <span class="icon"><i class="fas fa-trash" style="color: var(--status-danger)"></i></span>
            </button>
          </ng-container>
          <ng-template #editActions>
            <button class="button is-small is-success" (click)="guardarEdicion(almacen)">
              <span class="icon"><i class="fas fa-check"></i></span>
            </button>
            <button class="button is-small" (click)="cancelarEdicion()">
              <span class="icon"><i class="fas fa-times"></i></span>
            </button>
          </ng-template>
        </div>
      </div>
      <div *ngIf="expandedSecciones[almacen._id]" class="mt-3" style="border-top: 1px solid var(--border-color, #ddd); padding-top: 0.75rem">
        <div class="field has-addons mb-2">
          <div class="control is-expanded">
            <input class="input is-small" type="text" placeholder="Nueva sección" [(ngModel)]="nuevaSeccionNombre" (keyup.enter)="agregarSeccion(almacen._id)" />
          </div>
          <div class="control">
            <button class="button is-small is-info" (click)="agregarSeccion(almacen._id)" [disabled]="!nuevaSeccionNombre.trim()">
              <span class="icon"><i class="fas fa-plus"></i></span>
            </button>
          </div>
        </div>
        <div *ngFor="let seccion of seccionesOf(almacen._id)" class="columns is-vcentered is-variable is-2" style="padding: 0.25rem 0">
          <div class="column is-6">
            <ng-container *ngIf="editandoSeccionId !== seccion._id; else editSecNombre">
              <span class="is-size-7">{{ seccion.nombre }}</span>
              <span *ngIf="seccion.por_defecto" class="tag is-success is-light ml-1" style="font-size: 0.6rem">D</span>
            </ng-container>
            <ng-template #editSecNombre>
              <input class="input is-small" type="text" [(ngModel)]="editandoSeccionNombre" (keyup.enter)="guardarEdicionSeccion(seccion)" />
            </ng-template>
          </div>
          <div class="column is-narrow" style="margin-left: auto">
            <ng-container *ngIf="editandoSeccionId !== seccion._id; else editSecActions">
              <button class="button is-small is-ghost" (click)="iniciarEdicionSeccion(seccion)" title="Editar">
                <span class="icon"><i class="fas fa-pen" style="color: var(--accent-blue); font-size: 0.7rem"></i></span>
              </button>
              <button class="button is-small is-ghost" (click)="eliminarSeccion(seccion)" title="Eliminar" [disabled]="seccion.por_defecto">
                <span class="icon"><i class="fas fa-trash" style="color: var(--status-danger); font-size: 0.7rem"></i></span>
              </button>
            </ng-container>
            <ng-template #editSecActions>
              <button class="button is-small is-success" (click)="guardarEdicionSeccion(seccion)">
                <span class="icon"><i class="fas fa-check" style="font-size: 0.7rem"></i></span>
              </button>
              <button class="button is-small" (click)="cancelarEdicionSeccion()">
                <span class="icon"><i class="fas fa-times" style="font-size: 0.7rem"></i></span>
              </button>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-page-layout>
