<div class="modal" [ngClass]="{ 'is-active': nueva }">
  <div class="modal-background"></div>
  <div class="modal-card long animate__animated animate__fadeInUp">
    <div class="modal-card-head">
      <p class="modal-card-title fuente">Conversión de material</p>
      <button class="delete red_cross" aria-label="close" (click)="cerrar()"></button>
    </div>
    <div class="modal-card-body">
      <div class="columns">
        <div class="column">
          <span class="title">Almacén y convertidora</span>
          <hr />
          <div class="field is-grouped">
            <div class="control">
              <label class="label">Almacén</label>
              <div class="select">
                <select [(ngModel)]="almacen" (change)="sustrato = ''; ancho = 0; lote = ''">
                  <option value="">— Seleccionar —</option>
                  <option *ngFor="let alm of almacenesConBobinas" [value]="alm._id || ''">
                    {{ alm.nombre }}
                  </option>
                </select>
              </div>
            </div>
            <div class="control" *ngIf="almacen">
              <label class="label">Convertidora</label>
              <div class="select">
                <select [(ngModel)]="convertidora">
                  <option value="">— Seleccionar —</option>
                  <option *ngFor="let c of api.convertidora" [value]="c._id">
                    {{ c.nombre }}
                  </option>
                </select>
              </div>
            </div>
          </div>
          <span class="title" *ngIf="almacen">Detalle</span>
          <hr *ngIf="almacen" />
          <div class="field is-grouped" *ngIf="almacen">
            <div class="control">
              <label class="label">Sustrato</label>
              <div class="select">
                <select [(ngModel)]="sustrato" (change)="ancho = 0; lote = ''">
                  <option value="">— Seleccionar —</option>
                  <option *ngFor="let material of buscarSustratosDeBobinas()" [value]="material._id">
                    {{ material.nombre }} {{ material.gramaje }}(g/m²) {{ material.calibre }}pt
                  </option>
                </select>
              </div>
            </div>
            <div class="control" *ngIf="sustrato">
              <label class="label">Ancho (cm)</label>
              <div class="select">
                <select [(ngModel)]="ancho" (change)="lote = ''">
                  <option value="0">— Seleccionar —</option>
                  <option *ngFor="let a of buscarAnchos()" [value]="a">{{ a }}</option>
                </select>
              </div>
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control" *ngIf="ancho > 0">
              <label class="label">Lote</label>
              <div class="select">
                <select [(ngModel)]="lote" (change)="agregarFabricacion()">
                  <option value="">— Seleccionar —</option>
                  <option *ngFor="let l of api.ObtenerLotes(almacen, sustrato, ancho)" [value]="l">
                    {{ l }}
                  </option>
                </select>
              </div>
            </div>
            <div class="control" *ngIf="lote">
              <label class="label">Largo (cm)</label>
              <input type="number" class="input" style="width: 90px" [(ngModel)]="largo" />
            </div>
            <div class="control" *ngIf="lote">
              <label class="label">Hojas (und)</label>
              <input
                type="number"
                class="input"
                style="width: 90px"
                [(ngModel)]="hojas"
                (input)="calcularToneladas()"
              />
            </div>
            <div class="control" *ngIf="lote">
              <label class="label">Peso (t)</label>
              <input
                type="number"
                class="input"
                style="width: 90px"
                [(ngModel)]="peso"
                (input)="calcularHojasDesdeToneladas()"
              />
            </div>
          </div>
          <div class="field" *ngIf="lote">
            <div class="control">
              <label class="label">Observación</label>
              <textarea
                class="textarea"
                placeholder="Escribe una observación"
                style="resize: none"
                [(ngModel)]="observacion"
              ></textarea>
            </div>
          </div>
          <button class="button is-success" (click)="generatePdf()" [disabled]="disabled()">
            <span class="icon"><i class="fas fa-exchange-alt"></i></span>
            <span>Conversión</span>
          </button>
        </div>
        <div class="column">
          <div class="dimenciones" [style.width.px]="calcularWidth()" *ngIf="largo > 0 && ancho > 0">
            <div class="top-label">← {{ largo }} →</div>
            <div class="right-label">↑<br />{{ ancho.toString()[0] }}<br />{{ ancho.toString()[1] }}<br />↓</div>
          </div>
          <figure class="image is-5by3">
            <img src="../../../../assets/bobina.jpg" />
          </figure>
        </div>
      </div>
    </div>
  </div>
</div>
