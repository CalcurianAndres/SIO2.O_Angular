<app-nueva-maquina
  [nueva]="nueva"
  [data]="data"
  [editar]="editar"
  [fasesQueTrabaja]="selectedFases"
  (onCloseModal)="cerrarSencilla()"
  (onFinalizarTarea)="cerrar()"
>
</app-nueva-maquina>
<app-info-maquinas [info]="info" [informacion]="data" (onCloseModal)="cerradoSencillo()"> </app-info-maquinas>
<app-page-layout>
  <app-section-header
    title="Máquinas"
    description="Registro de maquinaria industrial"
    icon="fa-industry"
    color="purple"
  ></app-section-header>

  <button class="button is-info" (click)="nuevaMaquina()">
    <span class="icon"><i class="fas fa-plus-circle"></i></span>
    <span>Nueva Máquina</span>
  </button>
  <br /><br />

  <!-- Empty state -->
  <div *ngIf="!cargando && api.maquinas.length === 0" class="empty-state">
    <i class="fas fa-cog empty-icon"></i>
    <p class="empty-title">No hay máquinas registradas</p>
    <p class="empty-hint">Haz clic en el botón "Nueva Máquina" para comenzar</p>
    <i class="fas fa-arrow-up empty-arrow"></i>
  </div>

  <!-- Skeleton -->
  <div *ngIf="cargando && api.maquinas.length === 0" class="skeleton-list">
    <div *ngFor="let _ of [].constructor(3)" class="card skeleton-card">
      <div class="card-header"><div class="skeleton-line" style="width: 40%"></div></div>
    </div>
  </div>

  <!-- Cards -->
  <div *ngIf="api.maquinas.length > 0" class="cards-container">
    <!-- Search -->
    <div class="field" style="max-width: 320px; margin-bottom: 0.75rem">
      <div class="control has-icons-left">
        <input class="input" type="text" placeholder="Buscar máquina..." [(ngModel)]="searchTerm" />
        <span class="icon is-left"><i class="fas fa-search"></i></span>
      </div>
    </div>

    <div *ngFor="let maq of filteredMaquinas; index as i" class="card grupo-card animate__animated animate__fadeInUp">
      <div class="card-header">
        <div class="card-header-title">
          <i class="fas fa-cog grupo-icon"></i>
          <span class="grupo-nombre">{{ maq.nombre }}</span>
          <span *ngIf="maq.marca || maq.modelo" class="maq-sub"> {{ maq.marca }} {{ maq.modelo }} </span>
        </div>
        <div class="card-header-actions">
          <i class="fas fa-info-circle action-icon" title="Ver detalles" (click)="seleccion(i)"></i>
          <i class="far fa-edit green action-icon" title="Editar" (click)="Editar(i)"></i>
          <button class="button btn-action-icon" title="Eliminar" (click)="borrarMaquina(maq._id)">
            <span class="icon"><i class="fas fa-trash-alt icon-danger"></i></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</app-page-layout>
