<app-nueva-fase
  [nueva]="nueva"
  [editar]="editar"
  [data]="data"
  (onCloseModal)="cerrarSimple()"
  (onFinalizarProceso)="cerrar()"
>
</app-nueva-fase>
<app-informacion
  [data]="data"
  [info]="info"
  [maquines]="machines"
  [informacion]="informacion"
  (onCloseModal)="info = false"
>
</app-informacion>
<app-page-layout>
  <app-section-header
    title="Fases de producción"
    description="Etapas del proceso productivo"
    icon="fa-industry"
    color="purple"
  ></app-section-header>

  <button class="button is-info" (click)="nueva_fase()">
    <span class="icon"><i class="fas fa-plus-circle"></i></span>
    <span>Nueva Fase</span>
  </button>
  <br /><br />

  <!-- Empty state -->
  <div *ngIf="!cargando && api.fases.length === 0" class="empty-state">
    <i class="fas fa-industry empty-icon"></i>
    <p class="empty-title">No hay fases registradas</p>
    <p class="empty-hint">Haz clic en el botón "Nueva Fase" para comenzar</p>
    <i class="fas fa-arrow-up empty-arrow"></i>
  </div>

  <!-- Skeleton -->
  <div *ngIf="cargando && api.fases.length === 0" class="skeleton-list">
    <div *ngFor="let _ of [].constructor(3)" class="card skeleton-card">
      <div class="card-header"><div class="skeleton-line" style="width: 40%"></div></div>
    </div>
  </div>

  <!-- Cards -->
  <div *ngIf="api.fases.length > 0" class="cards-container">
    <!-- Search -->
    <div class="field" style="max-width: 320px; margin-bottom: 0.75rem">
      <div class="control has-icons-left">
        <input class="input" type="text" placeholder="Buscar fase..." [(ngModel)]="searchTerm" />
        <span class="icon is-left"><i class="fas fa-search"></i></span>
      </div>
    </div>

    <div *ngFor="let fase of filteredFases; index as i" class="card grupo-card animate__animated animate__fadeInUp">
      <div class="card-header">
        <div class="card-header-title">
          <i class="fas fa-industry grupo-icon"></i>
          <span class="grupo-nombre">{{ fase.nombre }}</span>
        </div>
        <div class="card-header-actions">
          <i class="fas fa-info-circle action-icon" title="Ver detalles" (click)="seleccion(i)"></i>
          <i class="far fa-edit green action-icon" title="Editar" (click)="Editar(i)"></i>
          <button class="button btn-action-icon" title="Eliminar" (click)="borrarFase(fase._id)">
            <span class="icon"><i class="fas fa-trash-alt icon-danger"></i></span>
          </button>
        </div>
      </div>
    </div>
  </div>
</app-page-layout>
