<!-- Nuevo material modal -->
<div class="modal" [ngClass]="{ 'is-active': nuevo_material || editar_material }">
  <div class="modal-background"></div>
  <div class="modal-card animate__animated animate__fadeInUp">
    <div class="modal-card-head">
      <p class="modal-card-title fuente">
        <i class="fas fa-box"></i>
        {{ editar_material ? 'Editar Material' : 'Nuevo Material' }}
      </p>
      <button class="delete red_cross" aria-label="close" (click)="cerrar_()"></button>
    </div>
    <div class="modal-card-body">
      <div class="field" *ngIf="!selectedGrupo">
        <label class="label">Grupo</label>
        <div class="control">
          <div class="select">
            <select [(ngModel)]="grupo" (change)="buscarFabricante($event.target)">
              <option value="">Seleccionar grupo</option>
              <option *ngFor="let grupo of grupos.grupos; index as i" [value]="i">
                {{ grupo.nombre }}
              </option>
            </select>
          </div>
        </div>
      </div>
      <div class="field" *ngIf="selectedGrupo">
        <label class="label">Grupo</label>
        <div class="control">
          <input type="text" class="input" [value]="selectedGrupo.nombre" disabled />
        </div>
      </div>

      <div class="field">
        <label class="label">Nombre del material</label>
        <div class="control">
          <input type="text" class="input" placeholder="Ej: Bond 75g" [(ngModel)]="nombre" />
        </div>
      </div>

      <div class="columns">
        <div class="column">
          <div class="field">
            <label class="label">Fabricante</label>
            <div class="control">
              <div class="select">
                <select [(ngModel)]="Fabricante">
                  <option value="">Seleccionar</option>
                  <option *ngFor="let fab of Fabricantes; index as i" [value]="i">{{ fab.alias }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="column">
          <div class="field">
            <label class="label">Serie</label>
            <div class="control">
              <input type="text" class="input" placeholder="Ej: A-1" [(ngModel)]="serie" />
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label">Código material</label>
        <div class="control">
          <input type="text" class="input" placeholder="Ej: PROV-001" [(ngModel)]="codigo" />
        </div>
      </div>

      <!-- Sustrato: calibre y gramaje -->
      <ng-container *ngIf="esSustrato">
        <hr class="modal-divider" />
        <label class="label section-label"><i class="fas fa-ruler"></i> Especificaciones de sustrato</label>
        <div class="columns">
          <div class="column">
            <div class="field">
              <label class="label">Calibre (pt)</label>
              <div class="control">
                <input type="text" class="input" placeholder="Ej: 12 pt" [(ngModel)]="calibre" />
              </div>
            </div>
          </div>
          <div class="column">
            <div class="field">
              <label class="label">Gramaje (g/m²)</label>
              <div class="control">
                <input type="text" class="input" placeholder="Ej: 75 g/m²" [(ngModel)]="gramaje" />
              </div>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Tintas: color -->
      <ng-container *ngIf="esTinta">
        <hr class="modal-divider" />
        <label class="label section-label"><i class="fas fa-palette"></i> Especificaciones de tinta</label>
        <div class="field">
          <label class="label">Color</label>
          <div class="control color-radios">
            <label class="radio" *ngFor="let opt of colores">
              <input type="radio" name="tintaColor" [value]="opt" [(ngModel)]="color" (change)="onColorChange()" />
              {{ opt }}
            </label>
          </div>

          <!-- Selector de Pantone -->
          <div class="pantone-field" *ngIf="esPantone">
            <div class="field has-addons" style="margin-top: 0.5rem">
              <div class="control is-expanded">
                <input
                  type="text"
                  class="input"
                  [value]="selectedPantone ? selectedPantone.code + ' (#' + selectedPantone.hex + ')' : ''"
                  readonly
                  placeholder="Seleccionar Pantone..."
                />
              </div>
              <div class="control">
                <button class="button is-info" (click)="openPantoneSelector()">
                  <span class="icon"><i class="fas fa-palette"></i></span>
                  <span>Buscar</span>
                </button>
              </div>
            </div>
            <!-- Preview del Pantone seleccionado -->
            <div class="pantone-preview" *ngIf="selectedPantone">
              <div
                class="swatch"
                [style.background-color]="
                  'rgb(' + selectedPantone.r + ',' + selectedPantone.g + ',' + selectedPantone.b + ')'
                "
              ></div>
              <span class="code">{{ selectedPantone.code }}</span>
              <span class="hex">#{{ selectedPantone.hex }}</span>
            </div>
          </div>
        </div>
      </ng-container>

      <!-- Cajas de embalaje: metros de cinta -->
      <ng-container *ngIf="esCaja">
        <hr class="modal-divider" />
        <label class="label section-label"><i class="fas fa-tape"></i> Especificaciones de caja</label>
        <div class="field">
          <label class="label">Cantidad de cinta por caja (metros)</label>
          <div class="control">
            <input type="number" class="input" placeholder="Ej: 50" [(ngModel)]="cinta" />
          </div>
        </div>
      </ng-container>

      <br />
      <button class="button is-success" [disabled]="!formValido" (click)="guardarMaterial()">
        <span class="icon" *ngIf="guardando"><i class="fas fa-spinner fa-pulse"></i></span>
        <span class="icon" *ngIf="!guardando"><i class="fas fa-save"></i></span>
        <span>{{ guardando ? 'Guardando...' : editar_material ? 'Guardar cambios' : 'Guardar' }}</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal selector de Pantone -->
<app-pantone-selector
  [isOpen]="showPantoneSelector"
  (pantoneSelected)="onPantoneSelected($event)"
  (closed)="showPantoneSelector = false"
></app-pantone-selector>
