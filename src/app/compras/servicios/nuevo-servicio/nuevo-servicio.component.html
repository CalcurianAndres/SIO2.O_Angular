<div class="modal" [ngClass]="{ 'is-active': nuevo || editar }">
  <div class="modal-background"></div>
  <div class="modal-card animate__animated animate__fadeInUp">
    <div class="modal-card-head">
      <p class="modal-card-title fuente">
        <i class="fas" [ngClass]="nuevo ? 'fa-cog' : 'fa-edit'"></i>
        {{ nuevo ? 'Nuevo Servicio' : 'Editar Servicio' }}
      </p>
      <button class="delete red_cross" aria-label="close" (click)="cerrar_()"></button>
    </div>

    <div class="modal-card-body">
      <!-- Nombre -->
      <div class="field">
        <label class="label">Nombre del servicio</label>
        <div class="control">
          <input
            type="text"
            class="input"
            placeholder="Ej: Servicio de internet, Transporte..."
            [(ngModel)]="nombre"
            *ngIf="nuevo"
          />
          <input type="text" class="input" [(ngModel)]="data.nombre" *ngIf="editar" />
        </div>
      </div>

      <!-- Guardar button -->
      <hr class="modal-divider" />
      <div class="field">
        <div class="control">
          <button
            class="button is-success"
            [disabled]="!formValido"
            (click)="nuevo ? GuardarServicio() : EditarServicio()"
          >
            <span class="icon" *ngIf="guardando"><i class="fas fa-spinner fa-pulse"></i></span>
            <span class="icon" *ngIf="!guardando"><i class="fas fa-save"></i></span>
            <span>{{ guardando ? 'Guardando...' : nuevo ? 'Guardar servicio' : 'Guardar cambios' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
