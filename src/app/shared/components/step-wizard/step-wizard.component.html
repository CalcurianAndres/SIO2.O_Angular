<div class="step-indicator">
  <div
    class="step-dot-wrapper"
    *ngFor="let s of steps"
    (click)="goToStep(s.num)"
    [ngClass]="{ active: currentStep === s.num, completed: s.num < currentStep }"
  >
    <div class="step-dot"><i class="fas" [ngClass]="s.icon"></i></div>
    <span class="step-label">{{ s.label }}</span>
  </div>
</div>

<div class="progress-wrapper">
  <div class="progress-bar"><div class="progress-fill" [style.width.%]="progressPercentage"></div></div>
  <span class="progress-text">{{ progressPercentage }}%</span>
</div>
