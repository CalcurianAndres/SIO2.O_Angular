<div class="tags-list" *ngIf="items?.length">
  <span
    *ngFor="let item of items; index as i"
    class="tag"
    [ngClass]="tagClass"
  >
    <ng-container *ngIf="template; else noTemplate">
      <ng-container *ngTemplateOutlet="template; context: { $implicit: item, index: i }"></ng-container>
    </ng-container>
    <ng-template #noTemplate>
      {{ item }}
    </ng-template>
    <button class="delete is-small" (click)="$event.stopPropagation(); remove.emit(i)"></button>
  </span>
</div>
