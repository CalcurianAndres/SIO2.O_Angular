<div class="modal" [ngClass]="{ 'is-active': visible }">
  <div class="modal-background" (click)="close()"></div>
  <div class="modal-card animate__animated animate__fadeInUp" [ngClass]="size">
    <div class="modal-card-head">
      <p class="modal-card-title fuente"><i class="fas" [ngClass]="icon"></i> {{ title }}</p>
      <button class="delete red_cross" aria-label="close" (click)="close()"></button>
    </div>
    <div class="modal-card-body">
      <ng-content></ng-content>
    </div>
    <div class="modal-card-foot" *ngIf="false">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
</div>
