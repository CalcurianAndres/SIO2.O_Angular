<app-nuevo-trabajador
  [nuevo_trabajador]="nuevo_trabajador"
  [trabajador]="trabajador"
  [referencias]="referencias"
  [carga]="carga"
  [emergencias]="emergencias"
  [cursos_realizados]="cursos_realizados"
  [softwares]="softwares"
  (onCloseModal)="nuevo_trabajador = false"
>
</app-nuevo-trabajador>

<app-informacion-empleado
  [informacion]="informacion"
  [_informacion]="_informacion_"
  (onCloseModal)="informacion = false"
>
</app-informacion-empleado>
<app-page-layout>
  <app-section-header
    title="Trabajadores"
    description="Registro de empleados activos"
    icon="fa-users"
    color="teal"
  ></app-section-header>
  <br />
  <button class="button is-info" (click)="nuevo_trabajador = true">
    <span class="icon"><i class="fas fa-plus-circle"></i></span>
    <span>Empleado</span></button
  >  <br />
  <br />
  <div class="tabs">
    <ul>
      <li [class.is-active]="filterMode === 'activos'">
        <a (click)="setFilterMode('activos')">Activos</a>
      </li>
      <li [class.is-active]="filterMode === 'todos'">
        <a (click)="setFilterMode('todos')">Todos</a>
      </li>
    </ul>
  </div>
  <div class="Departamentos">
    <div class="card dep" *ngFor="let cargos of listaTrabajadores">
      <div class="card_designed">
        <span class="color" [style.background-color]="cargos.contratacion.departamento.color">
          <div class="columns">
            <div class="column is-4">
              <figure class="image is-75x75 profile_pic">
                <app-img-fallback tipo="empleado" [filename]="cargos.datos_personales.foto"
                  cssClass="is-rounded" width="75px" height="75px"></app-img-fallback>
              </figure>
            </div>
            <div class="column">
              <span style="font-family: 'Gilroy'">
                {{ cargos.datos_personales.nombres }} <br />
                {{ cargos.datos_personales.apellidos }}
              </span>
            </div>
          </div>
        </span>
        <span class="info">
          {{ cargos.contratacion.cargo.nombre }} de <br />
          {{ cargos.contratacion.de.nombre }}
        </span>
        <span class="tag" [ngClass]="cargos.borrado ? 'is-danger' : 'is-success'">
          {{ cargos.borrado ? 'De baja' : 'Activo' }}
        </span>
      </div>
      <footer class="card-footer">
        <a class="card-footer-item"
          ><i class="fas fa-info-circle blue_" (click)="informacion = true; _informacion_ = cargos"></i
        ></a>
        <a class="card-footer-item"><i class="far fa-edit green" (click)="EDITAR_EMPLEADO(cargos)"></i></a>
        <button type="button" class="card-footer-item btn-action-icon" title="Eliminar" (click)="eliminarTrabajador(cargos)"><i class="fas fa-trash-alt icon-danger"></i></button>
      </footer>
    </div>
  </div>
</app-page-layout>
